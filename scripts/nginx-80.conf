server_tokens off;

server {
    listen 10.91.0.55:80 default_server;
    server_name 10.91.0.55;
    return 301 https://10.91.0.55$request_uri;
}

server {
    listen 10.91.0.55:443 ssl default_server;
    server_name 10.91.0.55;
    client_max_body_size 2g;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Index page
    location = / {
        default_type text/html;
        return 200 '<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nineone</title>
    <style>body{font-family:Arial,sans-serif;margin:40px}a{display:block;margin:12px 0;font-size:18px}</style>
  </head>
  <body>
    <h1>Nineone</h1>
    <a href="/sten/">Sten</a>
    <a href="/vitalych/">Vitalych</a>
    <a href="/deck/">Nodedeck</a>
  </body>
</html>';
    }

    # Redirect bare paths → trailing slash
    location = /sten     { return 301 /sten/; }
    location = /vitalych { return 301 /vitalych/; }
    location = /deck     { return 301 /deck/; }

    # Sten — uvicorn на :8000, prefix stripped
    location /sten/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_body_timeout 3600s;
    }

    # Nodedeck — editor static + engine-server API on :8787
    # API routes (proxy to engine-server, strip /deck prefix)
    location ~ ^/deck/(v1|health)(/|$) {
        rewrite ^/deck/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Editor SPA static files
    location /deck/ {
        alias /home/nineone/nodedeck/apps/editor/dist/;
        try_files $uri $uri/ /deck/index.html;
    }

    # Vitalych — uvicorn на :8085, prefix stripped
    location /vitalych/ {
        proxy_pass http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
